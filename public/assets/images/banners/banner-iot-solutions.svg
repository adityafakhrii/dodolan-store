<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="glow_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg_b1)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="900" y1="0" x2="900" y2="600" />
    <line x1="1100" y1="0" x2="1100" y2="600" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>
  
  <!-- Floating Telemetry Graphic Right Side -->
  <g transform="translate(750, 150)">
    <circle cx="200" cy="150" r="160" fill="#059669" opacity="0.1" />
    <circle cx="200" cy="150" r="110" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <!-- Fleet Route Node Visual -->
    <path d="M 120,170 Q 180,90 260,130 T 290,200" stroke="#38bdf8" stroke-width="4" fill="none" stroke-dasharray="6 4" />
    <circle cx="120" cy="170" r="8" fill="#10b981" />
    <circle cx="260" cy="130" r="8" fill="#e11d48" />
    <circle cx="290" cy="200" r="10" fill="#38bdf8" />
    
    <!-- Pulse Effect -->
    <circle cx="200" cy="150" r="45" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8" />
    <circle cx="200" cy="150" r="18" fill="#10b981" />
  </g>
</svg>
