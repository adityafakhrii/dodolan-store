  <text x="432" y="240" fill="#10b981" font-family="system-ui" font-size="10" font-weight="700" text-anchor="middle">8x PoE GIGABIT</text>

  <rect x="210" y="55" width="180" height="32" rx="16" fill="#059669" opacity="0.2" />
  <text x="300" y="76" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">8-CHANNEL MOBILE NVR</text>
