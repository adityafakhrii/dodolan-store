      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_nvr)" rx="20" />
  
  <rect x="110" y="120" width="380" height="220" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <rect x="135" y="150" width="220" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
