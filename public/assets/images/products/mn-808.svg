    <rect x="435" y="155" width="22" height="22" rx="4" />
    <rect x="465" y="155" width="22" height="22" rx="4" />
    <rect x="375" y="190" width="22" height="22" rx="4" />
    <rect x="405" y="190" width="22" height="22" rx="4" />
    <rect x="435" y="190" width="22" height="22" rx="4" />
    <rect x="465" y="190" width="22" height="22" rx="4" />
