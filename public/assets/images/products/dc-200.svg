<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_dc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_dc)" rx="20" />
  
  <!-- Mount Suction Base -->
  <polygon points="260,110 340,110 320,150 280,150" fill="#475569" />
  <rect x="290" y="150" width="20" height="20" fill="#334155" />
  
  <!-- Main Dashcam Body -->
  <rect x="180" y="170" width="240" height="150" rx="20" fill="#1e293b" stroke="#334155" stroke-width="5" />
  
  <!-- Front Road Lens -->
  <circle cx="250" cy="245" r="45" fill="#0f172a" stroke="#64748b" stroke-width="6" />
  <circle cx="250" cy="245" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <circle cx="250" cy="245" r="12" fill="#0284c7" />
  <circle cx="242" cy="237" r="5" fill="#ffffff" opacity="0.8" />
  
  <!-- Cabin IR Lens -->
  <circle cx="345" cy="225" r="25" fill="#0f172a" stroke="#e11d48" stroke-width="3" />
  <circle cx="345" cy="225" r="10" fill="#be123c" />
  <!-- IR LED array -->
  <circle cx="330" cy="210" r="3" fill="#e11d48" />
  <circle cx="360" cy="210" r="3" fill="#e11d48" />
  <circle cx="330" cy="240" r="3" fill="#e11d48" />
  <circle cx="360" cy="240" r="3" fill="#e11d48" />
  <text x="345" y="275" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">CABIN IR</text>

  <!-- SOS Button -->
  <rect x="280" y="325" width="40" height="15" rx="6" fill="#e11d48" />
  <text x="300" y="336" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800" text-anchor="middle">SOS</text>

  <rect x="215" y="55" width="170" height="32" rx="16" fill="#e11d48" opacity="0.2" />
  <text x="300" y="76" fill="#fb7185" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">4G LIVE DUAL DASHCAM</text>
</svg>
