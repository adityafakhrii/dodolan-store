<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cctv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_cctv)" rx="20" />
  
  <!-- Ceiling/Wall Mount Base -->
  <polygon points="230,110 370,110 350,150 250,150" fill="#334155" />
  <rect x="270" y="150" width="60" height="25" fill="#475569" />
  
  <!-- Dome Body Outer Shell -->
  <path d="M 220,180 A 90,90 0 0,0 380,180 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Inner Rotating Sphere -->
  <circle cx="300" cy="240" r="75" fill="#1e293b" stroke="#334155" stroke-width="4" />
  <circle cx="300" cy="240" r="42" fill="#0f172a" stroke="#64748b" stroke-width="5" />
  <circle cx="300" cy="240" r="22" fill="#0284c7" />
  <circle cx="292" cy="232" r="7" fill="#ffffff" opacity="0.8" />
  
  <!-- Dual Spotlight LEDs -->
  <circle cx="260" cy="240" r="8" fill="#facc15" />
  <circle cx="340" cy="240" r="8" fill="#facc15" />

  <rect x="220" y="55" width="160" height="32" rx="16" fill="#059669" opacity="0.2" />
  <text x="300" y="76" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">360° PTZ DOME CCTV</text>
</svg>
