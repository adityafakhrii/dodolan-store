<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_gt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="100%" stop-color="#14233c" />
    </linearGradient>
    <linearGradient id="glow_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_gt)" rx="20" />
  
  <!-- Subtle Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="300" y1="0" x2="300" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="500" y1="0" x2="500" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  
  <!-- Tracker Body -->
  <rect x="210" y="110" width="180" height="230" rx="24" fill="#1e293b" stroke="#334155" stroke-width="5" />
  <rect x="230" y="130" width="140" height="190" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- LED Indicators -->
  <circle cx="260" cy="165" r="7" fill="#10b981" />
  <text x="275" y="170" fill="#94a3b8" font-size="10" font-family="system-ui" font-weight="600">GPS</text>
  
  <circle cx="330" cy="165" r="7" fill="#38bdf8" />
  <text x="345" y="170" fill="#94a3b8" font-size="10" font-family="system-ui" font-weight="600">GSM</text>
  
  <!-- GPS Antenna Symbol -->
  <circle cx="300" cy="235" r="36" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="300" cy="235" r="22" fill="none" stroke="#10b981" stroke-width="3" />
  <circle cx="300" cy="235" r="8" fill="#e11d48" />
  
  <!-- Wire Harness Output -->
  <rect x="285" y="340" width="30" height="40" fill="#334155" rx="4" />
  <path d="M292 380 Q292 410 270 430" stroke="#e11d48" stroke-width="5" fill="none" stroke-linecap="round" />
  <path d="M300 380 Q300 420 300 440" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M308 380 Q308 410 330 430" stroke="#eab308" stroke-width="5" fill="none" stroke-linecap="round" />

  <!-- Badge / Label -->
  <rect x="235" y="55" width="130" height="32" rx="16" fill="#059669" opacity="0.2" />
  <text x="300" y="76" fill="#34d399" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">4G FLEET TRACKER</text>
</svg>
