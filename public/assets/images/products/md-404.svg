<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mdvr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg_mdvr)" rx="20" />
  
  <!-- MDVR Chassis -->
  <rect x="130" y="130" width="340" height="200" rx="16" fill="#1e293b" stroke="#475569" stroke-width="6" />
  <!-- Cooling Vents -->
  <line x1="160" y1="160" x2="220" y2="160" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="175" x2="220" y2="175" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="190" x2="220" y2="190" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Key Lock Mechanism -->
  <circle cx="265" cy="175" r="16" fill="#0f172a" stroke="#64748b" stroke-width="3" />
  <rect x="263" y="167" width="4" height="16" fill="#f8fafc" />
  
  <!-- SD Card / HDD Bay -->
  <rect x="150" y="225" width="150" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <text x="225" y="268" fill="#64748b" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">DUAL SD LOCK</text>
  
  <!-- Aviation Plugs (Camera Ports) -->
  <circle cx="345" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="390" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="345" cy="235" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <circle cx="390" cy="235" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="367" y="278" fill="#94a3b8" font-family="system-ui" font-size="10" font-weight="600" text-anchor="middle">4x AHD 1080P</text>

  <!-- Antennas -->
  <rect x="430" y="160" width="8" height="25" fill="#e2e8f0" rx="2" />
  <rect x="430" y="210" width="8" height="25" fill="#e2e8f0" rx="2" />
  
  <!-- AI ADAS Badge -->
  <rect x="210" y="55" width="180" height="32" rx="16" fill="#3b82f6" opacity="0.2" />
  <text x="300" y="76" fill="#60a5fa" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">AI ADAS &amp; DSM MDVR</text>
</svg>
